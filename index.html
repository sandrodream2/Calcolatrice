<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcolatrice Scientifica</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tabs">
  <button class="tab active" data-tab="calc">Scientifica</button>
  <button class="tab" data-tab="valuta">Valuta</button>
  <button class="tab" data-tab="peso">Peso</button>
  <button class="tab" data-tab="altezza">Altezza</button>
</div>

<!-- Calcolatrice scientifica -->
<section id="calc" class="panel active">
  <div class="brand">CASIO&nbsp;STYLE &nbsp;·&nbsp; <span id="mode-indicator">DEG</span> &nbsp;·&nbsp; <span id="hyp-indicator"></span><span id="shift-indicator">SHIFT</span></div>
  <div class="screen">
    <div class="expr" id="expr-display">&nbsp;</div>
    <div class="main" id="display">0</div>
  </div>
  <div class="keys sci">
    <button class="key fn" data-ins="shift" id="btn-shift">SHIFT</button>
    <button class="key fn" data-ins="mode">DEG</button>
    <button class="key fn" data-ins="(">(</button>
    <button class="key fn" data-ins=")">)</button>

    <button class="key fn" data-ins="sin(">sin</button>
    <button class="key fn" data-ins="cos(">cos</button>
    <button class="key fn" data-ins="tan(">tan</button>
    <button class="key fn" data-ins="pi">π</button>

    <button class="key fn" data-ins="ln(">ln</button>
    <button class="key fn" data-ins="log(">log</button>
    <button class="key fn" data-ins="sqrt(">√</button>
    <button class="key fn" data-ins="e">e</button>

    <button class="key fn" data-ins="^2">x²</button>
    <button class="key fn" data-ins="^">xʸ</button>
    <button class="key fn" data-ins="fact(">x!</button>
    <button class="key fn" data-ins="Ans">Ans</button>

    <button class="key action" data-ins="C">AC</button>
    <button class="key action" data-ins="DEL">DEL</button>
    <button class="key fn" data-ins="%">%</button>
    <button class="key op" data-ins="/">÷</button>

    <button class="key" data-ins="7">7</button>
    <button class="key" data-ins="8">8</button>
    <button class="key" data-ins="9">9</button>
    <button class="key op" data-ins="*">×</button>

    <button class="key" data-ins="4">4</button>
    <button class="key" data-ins="5">5</button>
    <button class="key" data-ins="6">6</button>
    <button class="key op" data-ins="-">−</button>

    <button class="key" data-ins="1">1</button>
    <button class="key" data-ins="2">2</button>
    <button class="key" data-ins="3">3</button>
    <button class="key op" data-ins="+">+</button>

    <button class="key" data-ins="0">0</button>
    <button class="key" data-ins=".">,</button>
    <button class="key fn" data-ins="EXP">×10ˣ</button>
    <button class="key eq" data-ins="=">=</button>
  </div>
  <div class="hint">SHIFT: asin/acos/atan, 10ˣ, eˣ, x³, ∛, ¹/x</div>
</section>

<!-- Valuta -->
<section id="valuta" class="panel converter">
  <div class="field">
    <label>Importo</label>
    <input id="val-importo" type="number" step="any" value="1">
  </div>
  <div class="field">
    <label>Da</label>
    <select id="val-da">
      <option value="EUR">EUR — Euro</option>
      <option value="USD">USD — Dollaro USA</option>
      <option value="GBP">GBP — Sterlina UK</option>
      <option value="CHF">CHF — Franco svizzero</option>
      <option value="JPY">JPY — Yen giapponese</option>
    </select>
  </div>
  <div class="field">
    <label>A</label>
    <select id="val-a">
      <option value="EUR">EUR — Euro</option>
      <option value="USD" selected>USD — Dollaro USA</option>
      <option value="GBP">GBP — Sterlina UK</option>
      <option value="CHF">CHF — Franco svizzero</option>
      <option value="JPY">JPY — Yen giapponese</option>
    </select>
  </div>
  <div class="result" id="val-risultato"></div>
</section>

<!-- Peso -->
<section id="peso" class="panel converter">
  <div class="field">
    <label>Peso</label>
    <input id="pes-importo" type="number" step="any" value="1">
  </div>
  <div class="field">
    <label>Da</label>
    <select id="pes-da">
      <option value="kg">kg — Chilogrammi</option>
      <option value="g">g — Grammi</option>
      <option value="lb">lb — Libbre</option>
      <option value="oz">oz — Once</option>
    </select>
  </div>
  <div class="field">
    <label>A</label>
    <select id="pes-a">
      <option value="kg">kg — Chilogrammi</option>
      <option value="g">g — Grammi</option>
      <option value="lb">lb — Libbre</option>
      <option value="oz">oz — Once</option>
    </select>
  </div>
  <div class="result" id="pes-risultato"></div>
</section>

<!-- Altezza -->
<section id="altezza" class="panel converter">
  <div class="field">
    <label>Altezza</label>
    <input id="alt-importo" type="number" step="any" value="1">
  </div>
  <div class="field">
    <label>Da</label>
    <select id="alt-da">
      <option value="m">m — Metri</option>
      <option value="cm">cm — Centimetri</option>
      <option value="ft">ft — Piedi</option>
      <option value="in">in — Pollici</option>
    </select>
  </div>
  <div class="field">
    <label>A</label>
    <select id="alt-a">
      <option value="m">m — Metri</option>
      <option value="cm">cm — Centimetri</option>
      <option value="ft">ft — Piedi</option>
      <option value="in">in — Pollici</option>
    </select>
  </div>
  <div class="result" id="alt-risultato"></div>
</section>

<script src="script.js"></script>
</body>
</html>
